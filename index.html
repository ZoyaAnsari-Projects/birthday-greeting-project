<!DOCKTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Happy Birthday, My Love</title>
<style> 
  :root{
  /* Your custom romantic palette*/
 --bg-pink: #fce4ec;  /* The original soft pink */
  --bg-lavender: #e6e6fa;  /* The cooling light lavender */
  --accent-pink: #ff4081;  /* Vibrant pink for dots and buttons */
  --text-main: #333333;
}

body {
  /* The romantic and cooling gradient */
  background: linear-gradient(135deg, var(--bg-pink) 0%, var(--bg-lavender) 100%);
  margin: 0;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Seoge UI', Tanhoma, Geneva, Verdana, sans-serif;
  overflow: hidden; /* Prevents scrolling*/
}

/*---PHASE 1: PASSCODE SCREEN ---*/

  .passcode-container {
    background: rgba(255, 255, 255, 0.9);
    padding: 30px;
    border-radius: 20px
    box-shadow: 0 10px 30px rgba(230, 230, 250, 0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 90%;
    width: 350px;
    text-align: center;
  }

  .polaroid {
    background: white;
    padding: 10px 10px 20px 10px;
    border-radius: 8px;
    box-shadow:0 4px 15px rgba(0,0,0,0.8);
    margin-bottom: 25px;
  }

  .polaride img {
    width: 180px;
    height: 180px
    objecct-fit: cover;
    border-radius: 5px;
  }

  .polaroid p {
    margin: 10px 0 0 0;
    font-size:16px;
    color: var(--text-main);
    font-weight: bold;
    letter-spacing: 1px;
  }

  .passcode-section h2 {
    margin: 0 0 20px 0;
    color: var(--text-main);
    font-weight: 600;
    font-size: 1.2rem;
  }

  .dots {
    display: flex;
    gap:12px;
    margin-bottom: 25px;
    justify-content: center;
  }

  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background-color: #e0e0e0;
    transition: background-color 0.3s ease;
  }

  .dot.filled {
    background-color: var(--accent-pink);
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 15px;
    width: 100%;
  }

  .key {
    width: 60px;
    height: 60px;
    margin: 0 auto;
    border-radius: 50%;
    border: none;
    background: #f7f7f7;
    font-size: 20px;
    font-weight: 500;
    color: #555;
    cursor: pointer;
    transition: all 0.2s;
  }

  .key:active {
    transform: scale(0.95);
    background: var(--bg-lavender);
  }

  .key.icon {
    background: transparent;
    color: var(--accent-pink);
    font-size: 24px;
  }
</style>
</head>
  
<body>

  <!-- PHASE1: PASSCODE -->
  <div class="passcode-container" id="phase-1">
    <div class="polaroid">
      <!-- Replace this URL with a link to a photo of you two later -->
      <img src="https://github.com/ZoyaAnsari-Projects/birthday-greeting-project/blob/main/WhatsApp%20Image%202026-10-10%20at%2021.50.56.jpeg" alt="Us">
      <p>Happy Birthday ❤️</p>
    </div>

  <div class="passcode-section">
    <h2>Enter Passcode</h2>
    <div class="dots">
      <div class="dot" id="dot-1"></div>
      <div class="dot" id="dot-2"></div>
      <div class="dot" id="dot-3"></div>
      <div class="dot" id="dot-4"></div>
    </div>
<div class="keypad">
  <button class="key" onclick="pressKey('1')">1</button>
  <button class="key" onclick="pressKey('2')">2</button>
  <button class="key" onclick="pressKey('3')">3</button>
  <button class="key" onclick="pressKey('4')">4</button>
  <button class="key" onclick="pressKey('5')">5</button>
  <button class="key" onclick="pressKey('6')">6</button>
  <button class="key" onclick="pressKey('7')">7</button>
  <button class="key" onclick="pressKey('8')">8</button>
  <button class="key" onclick="pressKey('9')">9</button>
  <button class="key icon"></button>
  <button class="key" onclick="presskey('0')">0</button>
  <button class="key icon" onclick="deleteKey()">&#x232B;</button>
      </div>
    </div>
  </div>

<script>
  let passcode = "";
  // Set your password or a special 4-digit number here
  const correctPasscode= "0506";

  function updateDots() {
    for (let i = 1; i <=4; i++) {
      const dot = document.getElementById('dot-${i}');
      if (i <=passcode.length) {
        dot.classList.add('filled');
      } else {
        dot.classList.remove('filled');
      }
    }
  }

  function pressKey(num) {
    if (passcode.length < 4) {
      passcode += num;
      updateDots();

      if (passcode.length === 4) {
        setTimeout(checkPasscode, 300);
      }
    }
  }

  function deleteKey() {
    if (passcode.length > 0) {
      passcode = passcode.slice(0, -1);
      updateDots();
    }
  }

  function checkPasscode() {
    if (passcode === correctPasscode) {
      alert("Passcode Correct! Ready to trigger Phase 2.");
      //The code tom switch to the "Pull the String" phase will go right here
    } else {
      //Small shake animation could be added here later
      passcode = "";
      updateDots();
    }
  }
</script>  
</body>    
</html>
